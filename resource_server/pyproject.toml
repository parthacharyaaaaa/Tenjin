[project]
name = "resource-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "auxillary>=0.1.0",
    "ecdsa>=0.19.2",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "redis>=7.0.0, <8",
    "resource_auxillary>=0.1.0",
    "sqlalchemy>=2.0.50",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
auxillary = { workspace = true}
resource_auxillary = { workspace = true}

[tool.deptry]
known_first_party=[
    "auth_server",
    "auxillary",
    "resource_auxillary",
    "resource_database_workers",
    "resource_server"
]

[tool.deptry.package_module_name_map]
python-dotenv = "dotenv"
pyjwt = "jwt"
