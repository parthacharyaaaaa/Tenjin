repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
        language_version: python3.13
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: bandit_wrapper
        name: bandit_wrapper
        language: python
        language_version: python3.13
        entry: .pre-commit/bandit_wrapper.bash
        pass_filenames: false
        additional_dependencies:
          - "bandit[toml, baseline]"

  - repo: local
    hooks:
      - id: deptry_wrapper
        name: deptry_wrapper
        language: python
        language_version: python3.13
        entry: .pre-commit/deptry_wrapper.bash
        pass_filenames: false
        additional_dependencies:
          - "deptry"
