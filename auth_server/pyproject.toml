[project]
name = "auth-server"
version = "1.0.0"
description = "Authentication authority for Tenjin"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4,<2",
    "cryptography>=50.0.0,<51",
    "mako>=1.3.12,<2",
    "pydantic>=2.11.10,<3",
    "pydantic-settings>=2.14.2,<3",
    "pyjwt>=2.15.0,<3",
    "python-dotenv>=1.2.2,<2",
    "redis>=7.0.0, <8",
    "auxillary",
    "fastapi[standard]>=0.136.3",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0.51",
    "httpx>=0.28.1",
    "types-aiofiles>=25.1.0.20260518",
    "orjson>=3.11.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
auxillary = {workspace = true}


[tool.deptry]
known_first_party=[
    "auth_server",
    "auxillary"
]
extend_exclude = [".*/tests"]

[tool.deptry.package_module_name_map]
python-dotenv = "dotenv"
pyjwt = "jwt"

[tool.deptry.per_rule_ignores]
DEP002 = ["psycopg", "mako", "types-aiofiles"]

[tool.pyrefly]
project-excludes=[
    "**/alembic/versions"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers[postgres,redis]>=4.15.0",
]
