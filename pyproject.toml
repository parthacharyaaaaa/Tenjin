[project]
name = "tenjin"
version = "1.0.0"
description = "Tenjin"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "ruff>=0.16.7",
]

[tool.uv.workspace]
members = [
    "auth_server",
    "auxillary",
    "resource_auxillary",
    "resource_database_workers",
    "resource_server",
    "email_worker",
]

[dependency-groups]
dev = [
    "bandit[baseline,toml]>=1.9.4",
    "deptry>=0.25.1",
    "orjson>=3.11.9",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.bandit]
skips=[
    "B201",
    "B507",
    "B610",
    "B611",
    "B614",
    "B615",
    "B703",
]
exclude_dirs=[
    ".venv",
    ".pre-commit/utilities"
]


[tool.deptry]
known_first_party=[
    "auth_server",
    "auxillary",
    "resource_auxillary",
    "resource_database_workers",
    "resource_server"
]

[tool.pyrefly]
project-excludes=[
    "**/alembic"
]
